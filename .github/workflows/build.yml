name: Build Dylib
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1.3.0

      - name: Build Tweak
        run: |
          make FINALPACKAGE=1
          find . -name "*.dylib" -exec cp {} . \;

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Dylib-Ready-For-Esign
          path: "*.dylib"
